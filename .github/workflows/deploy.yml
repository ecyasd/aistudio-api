name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
permissions: {}
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'ecyasd/aistudio-api'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      eligible: ${{ steps.provenance.outputs.eligible }}
      commit: ${{ steps.provenance.outputs.commit }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/github-script@v7
        id: provenance
        with:
          script: |
            const run = context.payload.workflow_run;
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'master'});
            const eligible = run.head_branch === 'master' && run.path === '.github/workflows/ci.yml' &&
              run.head_sha === branch.commit.sha && /^[a-f0-9]{40}$/.test(run.head_sha);
            core.setOutput('eligible', String(eligible));
            core.setOutput('commit', run.head_sha);
      - uses: actions/download-artifact@v4
        if: steps.provenance.outputs.eligible == 'true'
        with:
          name: aistudio-container-${{ steps.provenance.outputs.commit }}
          path: image-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify image archive and publish versioned release
        if: steps.provenance.outputs.eligible == 'true'
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.provenance.outputs.commit }}
        shell: bash
        run: |
          cd image-release
          test "$(find . -maxdepth 1 -type f | wc -l)" = 2
          sha256sum --check image.tar.gz.sha256
          digest=$(sha256sum image.tar.gz | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if gh release view "container-$COMMIT" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir previous
            gh release download "container-$COMMIT" --repo "$GITHUB_REPOSITORY" --pattern image.tar.gz.sha256 --dir previous
            cmp image.tar.gz.sha256 previous/image.tar.gz.sha256
          else
            gh release create "container-$COMMIT" image.tar.gz image.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "Linux container $COMMIT" \
              --notes "Verified Linux amd64 API + local WAA image. No runtime credentials or account data."
          fi
  deploy:
    needs: publish
    if: needs.publish.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEPLOY_REGION }}
      - name: Deploy through the existing restricted SSM document
        env:
          COMMIT: ${{ needs.publish.outputs.commit }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          DOCUMENT: ${{ vars.AWS_DEPLOY_DOCUMENT }}
          NODE: ${{ vars.AWS_DEPLOY_NODE_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          commit, digest = os.environ['COMMIT'], os.environ['DIGEST']
          assert re.fullmatch('[a-f0-9]{40}', commit) and re.fullmatch('[a-f0-9]{64}', digest)
          def aws(*args):
              process = subprocess.run(['aws','ssm',*args,'--output','json','--no-cli-pager'], capture_output=True, text=True, timeout=45)
              if process.returncode:
                  if 'InvocationDoesNotExist' in process.stderr: return None
                  raise RuntimeError('SSM operation failed; output withheld')
              return json.loads(process.stdout)
          response = aws('send-command','--document-name',os.environ['DOCUMENT'],'--instance-ids',os.environ['NODE'],
                         '--parameters',json.dumps({'CommitSha':[commit],'ArtifactSha256':[digest]}), '--timeout-seconds','600')
          identifier = response['Command']['CommandId']
          print(json.dumps({'commandId':identifier}))
          for _ in range(120):
              time.sleep(5)
              invocation = aws('get-command-invocation','--command-id',identifier,'--instance-id',os.environ['NODE'])
              if not invocation or invocation['Status'] in {'Pending','InProgress','Delayed'}: continue
              assert invocation['Status'] == 'Success' and invocation['ResponseCode'] == 0, 'Deployment failed; raw output withheld'
              result = json.loads(invocation['StandardOutputContent'])
              assert result['ok'] and result['commit'] == commit and result['sha256'] == digest
              assert all(result['checks'].values())
              print(json.dumps({'ok':True,'commit':commit,'checksPassed':True}))
              break
          else: raise RuntimeError('Deployment timed out')
          PY
