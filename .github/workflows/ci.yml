name: CI

on:
  push:
    branches:
      - master
      - main
      - feat/browserless-console
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Path Filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/aistudio_api/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web/**'
              - '.github/workflows/ci.yml'

  backend-check:
    name: Full Backend and SDK Regression
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: uv run --no-sync ruff check .

      - name: Run Pyright Type Check
        run: uv run --no-sync pyright

      - name: Run Pytest Suite
        run: uv run --no-sync python scripts/run_tests.py

  frontend-check:
    name: Frontend Type Check, Regression and Build
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Verify Web Production Build
        run: npm run build

  container-build:
    name: Linux amd64 Container
    needs: [backend-check, frontend-check]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build complete API and local WAA image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: aistudio-console:${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Offline image startup and auth checks
        shell: bash
        run: |
          docker run -d --name image-smoke --network none \
            --tmpfs /data:uid=10001,gid=10001 --tmpfs /logs:uid=10001,gid=10001 \
            -e AISTUDIO_WEB_PASSWORD=synthetic-admin \
            -e AISTUDIO_BOOTSTRAP_API_KEY=synthetic-call \
            aistudio-console:${{ github.sha }}
          for attempt in $(seq 1 45); do
            if test "$(docker inspect --format '{{.State.Running}}' image-smoke)" != true; then
              docker logs image-smoke
              exit 1
            fi
            if docker exec image-smoke curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          docker exec image-smoke python /app/deploy/smoke_image.py
          docker rm -f image-smoke
      - name: Show synthetic startup failure
        if: failure()
        run: docker logs image-smoke 2>/dev/null || true
      - name: Export immutable Docker image
        shell: bash
        run: |
          mkdir -p image-release
          docker save aistudio-console:${{ github.sha }} | gzip -1 > image-release/image.tar.gz
          cd image-release
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aistudio-container-${{ github.sha }}
          path: image-release/*
          compression-level: 0
          retention-days: 7

